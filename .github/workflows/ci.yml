name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  motor:
    name: Motor Python ${{ matrix.python }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 é o mínimo do pyproject; o sys.settrace muda entre versões, por isso a matriz.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest
      # Os testes da interface leem frontend/src/testes/*.json, gerados pelo motor: se o motor
      # mudou e ninguém gerou de novo, eles passariam conferindo dados velhos.
      - name: Casos da revelação em dia com o motor
        if: matrix.python == '3.12'
        run: python frontend/scripts/casos_revelacao.py --conferir

  pyodide:
    name: Motor dentro do Pyodide (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node scripts/pytest_pyodide.mjs

  frontend:
    name: Interface (testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build
